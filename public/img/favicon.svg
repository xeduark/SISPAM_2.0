<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Comité de Estudios Médicos">
    <title>Comité de Estudios Médicos</title>

    <!--
        La marca: una «C» abierta a la derecha sobre la baldosa oscura del
        Comité. Va como forma y no como letra de una tipografía: así se ve
        igual en cualquier equipo, sin depender de las fuentes instaladas.

        No es una circunferencia: los costados son planos. La letra es una
        superelipse —la familia del cuadrado de esquinas redondeadas—, y por
        eso el radio en las diagonales supera al de los ejes.

        Los valores no se eligieron a ojo: se buscaron contra el original de
        48 px comparando píxel a píxel, hasta un 94.4% de coincidencia.
        Contorno de fuera: ejes 15.5 y 14.2, exponente 3.1. Hueco de dentro:
        2.6 menos de radio y exponente 3.8, que va algo más escuadrado.
        Abertura de 44 grados centrada a la derecha, con remates a corte recto.
    -->
    <rect width="48" height="48" rx="10" fill="#3A3D46"/>

